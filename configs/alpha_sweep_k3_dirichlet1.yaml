# Alpha sweep (2026-11-18): FL K=3 Dirichlet regression, alpha = 1.
# Identical to configs/relabel_k3_dirichlet0.1.yaml except dirichlet_alpha and the
# unused output_dir: FedAvg, E=5, persistent client optimizer, 60 rounds,
# client_num_cpus 3, 2-identity floor, split seed 4601, init seed 4601.
# The queue (scripts/run_alpha_sweep.py) passes --set partition_seed=4601/5601/6601
# for the three partition draws (4601 = the relabel partition) and --set init_seed=4602
# for the two initialization controls. Results go under artifacts/alpha_sweep only.
split_seed: 4601
init_seed: 4601

classification_artifact: artifacts/relabel/data/classification/raw_windows_combined.pt
regression_artifact: artifacts/centralized_combined_regression_9ch_no006_walking_80_20_60e/raw_walking_windows_regression.pt

centralized_classification_dir: artifacts/relabel/centralized/classification/seed4601
centralized_regression_dir: artifacts/centralized_combined_residual_runbalanced_9ch_no006_60e
centralized_absolute_regression_summary: artifacts/centralized_combined_regression_9ch_no006_walking_80_20_60e/training_summary.json
# Always overridden by the queue's --output-root; never written.
output_dir: artifacts/alpha_sweep/unused_k3_dirichlet1

federated:
  framework: flower
  aggregation: FedAvg
  # iid: speed-ordered round-robin within (source, subject, direction) strata, K in {2, 3}.
  # natural: one client per collection campaign (K=2); same corridor, 19.6 months apart.
  partition_scheme: dirichlet
  dirichlet_alpha: 1
  num_clients: 3
  num_rounds: 60
  local_epochs: 5
  client_optimizer_state: persistent
  fraction_fit: 1.0
  fraction_evaluate: 0.0
  min_available_clients: 3
  accept_failures: false
  client_num_cpus: 3
  client_num_gpus: 0.0

training:
  classification_batch_size: 32
  regression_run_batch_size: 4
  initial_learning_rate: 0.001
  minimum_learning_rate: 0.00001
  weight_decay: 0.0001
  num_workers: 0
  lr_schedule: cosine_over_rounds

experiment:
  selected_channels_one_based: [1, 2, 3, 4, 5, 6, 7, 8, 10]
  excluded_subjects: [6]
  included_subjects: [1, 2, 3, 4, 5, 7, 8]
  test2_sample_rate_override_hz: 1706.667
  target_sample_rate_hz: 400.0
  window_seconds: 5.0
  step_seconds: 1.0
  train_ratio: 0.8
  test_ratio: 0.2
  classification_include_no_walking: true
  regression_include_no_walking: false
  regression_target_level: run
  regression_baseline: source_subject_training_mean
  regression_client_weight: unique_training_runs
