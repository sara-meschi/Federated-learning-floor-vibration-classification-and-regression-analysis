# S5 centralized reference, init seed 4602 on the fixed seed-4601 split. Identical to
# configs/centralized_combined_residual_runbalanced_9ch_no006_60e.yaml except the seed
# keys, the baseline summary path (the same-seed absolute run, used only for a
# comparison field) and output_dir (the S5 queue always passes --output-root).
base_experiment_config: configs/centralized_combined_regression_9ch_no006_walking_80_20_60e.yaml
artifact_path: artifacts/centralized_combined_regression_9ch_no006_walking_80_20_60e/raw_walking_windows_regression.pt
# The same-seed absolute run from the S5 queue (comparison field only).
baseline_summary_path: artifacts/s5/centralized/absolute/seed4602/training_summary.json
# Always overridden by the queue's --output-root; never written.
output_dir: artifacts/s5/unused_residual_init4602

split_seed: 4601
init_seed: 4602

training:
  run_batch_size: 4
  epochs: 60
  learning_rate: 0.001
  minimum_learning_rate: 0.00001
  weight_decay: 0.0001
  num_workers: 0
